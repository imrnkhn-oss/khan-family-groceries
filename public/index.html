<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d7547">
<title>Khan Family Groceries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* Layout: one phone-width column — add bar, list by store section in walking order, cart, buy-again chips. */
:root {
  --bg: #f1f5f1; --surface: #ffffff; --ink: #16201a; --muted: #5d6a61; --line: #d9e2da;
  --accent: #1d7547; --accent-ink: #ffffff; --wash: #e0efe5; --warn: #b93c29; --warn-wash: #f8e3df;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1411; --surface: #172019; --ink: #e6eee8; --muted: #93a397; --line: #263229;
  --accent: #5cc48c; --accent-ink: #0d1a12; --wash: #1b3123; --warn: #ec8473; --warn-wash: #3a1f1a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1411; --surface: #172019; --ink: #e6eee8; --muted: #93a397; --line: #263229;
  --accent: #5cc48c; --accent-ink: #0d1a12; --wash: #1b3123; --warn: #ec8473; --warn-wash: #3a1f1a; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 20px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.chip-status { font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.chip-status.saving { color: var(--accent); border-color: var(--accent); }
.chip-status.warn { color: var(--warn); border-color: var(--warn); }

form.add { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid;
  grid-template-columns: minmax(0,1fr) 64px auto; gap: 8px; }
form.add input, form.add select, .who input { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
form.add input:focus-visible, form.add select:focus-visible, .who input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#f-qty { text-align: center; }
.btn { font: inherit; font-weight: 600; border: none; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn-danger { background: var(--warn); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: default; }
.who { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.who button { font: inherit; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; }
.who input { font-size: 14px; padding: 6px 10px; width: 140px; }

.aisle { display: flex; flex-direction: column; gap: 6px; }
.aisle-head { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 15px; }
.aisle-head .n { font-family: var(--body); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.aisle-head .tag { font-family: var(--body); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent); background: var(--wash); border-radius: 4px; padding: 2px 6px; }
ul.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
ul.items li { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-top: 1px solid var(--line); min-height: 52px; }
ul.items li:first-child { border-top: none; }
.check { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: transparent; cursor: pointer;
  display: grid; place-items: center; padding: 0; color: var(--accent-ink); }
.check svg { width: 14px; height: 14px; opacity: 0; }
li.done .check { background: var(--accent); border-color: var(--accent); }
li.done .check svg { opacity: 1; }
.item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item-name { font-weight: 500; overflow-wrap: anywhere; }
li.done .item-name { text-decoration: line-through; color: var(--muted); }
.item-meta { font-size: 12px; color: var(--muted); }
.qty { flex: none; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); background: var(--wash);
  border: none; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-family: inherit; }
.qty.empty { color: var(--muted); background: transparent; border: 1px dashed var(--line); }
.del { flex: none; width: 32px; height: 32px; border: none; background: none; color: var(--muted); cursor: pointer; border-radius: 8px; font-size: 18px; }
.del:hover { color: var(--warn); background: var(--warn-wash); }

.section-title { font-family: var(--display); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.confirm { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; cursor: pointer; }
.chips button:hover { border-color: var(--accent); color: var(--accent); }
.chips button::before { content: "+ "; color: var(--accent); }
.empty-state { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 22px 16px; text-align: center; color: var(--muted); font-size: 15px; }
.note { font-size: 13px; color: var(--muted); }
body.readonly form.add, body.readonly .del, body.readonly .who { display: none; }
@media (prefers-reduced-motion: no-preference) { ul.items li { transition: background .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Khan Family Groceries</h1>
      <div class="sub" id="summary">Loading the list…</div>
    </div>
    <span class="chip-status" id="status">Loading…</span>
  </header>

  <form class="add" id="add-form" autocomplete="off">
    <input id="f-name" placeholder="Add an item, e.g. eggs" aria-label="Item" maxlength="60" required>
    <input id="f-qty" placeholder="Qty" aria-label="Quantity" maxlength="12">
    <button class="btn btn-primary" type="submit">Add</button>
  </form>
  <div class="who" id="who"></div>

  <div id="list"></div>
  <div id="cart"></div>
  <div id="again"></div>
  <p class="note" id="foot"></p>
</div>
<script src="/shared.js"></script>
<script>
(function () {
  const AISLE_NAME = Object.fromEntries(AISLES.map(a => [a[0], a[1]]));
  let state = { items: [], history: [], applied: [] };
  let loaded = false, pending = [], sending = false, confirmingClear = false;
  const NAME_KEY = "groceries-name";
  let myName = ""; try { myName = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function setStatus(cls, text) { const el = document.getElementById("status"); el.className = "chip-status " + cls; el.textContent = text; }

  // Server state plus this phone's unsent changes on top.
  function view() {
    const s = JSON.parse(JSON.stringify(state));
    for (const op of pending) apply(s, op);
    return s;
  }
  async function refresh() {
    if (sending) return;
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) throw new Error();
      state = await r.json(); loaded = true;
      if (!pending.length) setStatus("", "Synced");
      render();
    } catch (e) { setStatus("warn", "Offline"); }
  }
  async function flush() {
    if (sending || !pending.length) return;
    sending = true; setStatus("saving", "Saving…");
    const batch = pending.slice();
    try {
      const r = await fetch("/api/ops", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ops: batch }) });
      if (!r.ok) throw new Error();
      state = await r.json();
      pending = pending.filter(op => !state.applied.includes(op.id));
      setStatus("", "Synced");
      document.getElementById("foot").textContent = "";
    } catch (e) {
      setStatus("warn", "Not saved");
      document.getElementById("foot").textContent = "Couldn't reach the list. Your changes will save when the connection is back.";
      setTimeout(flush, 5000);
    }
    sending = false; render();
    if (pending.length) flush();
  }
  function act(op) { op.id = uid(); pending.push(op); render(); flush(); }

  const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
  function row(i) {
    const meta = i.by ? "added by " + esc(i.by) : "";
    return '<li class="' + (i.checked ? "done" : "") + '">' +
      '<button class="check" data-act="toggle" data-id="' + esc(i.id) + '" aria-pressed="' + (i.checked ? "true" : "false") + '" aria-label="' + (i.checked ? "Put back " : "Got ") + esc(i.name) + '">' + CHECK + "</button>" +
      '<div class="item-main"><span class="item-name">' + esc(i.name) + "</span>" + (meta ? '<span class="item-meta">' + meta + "</span>" : "") + "</div>" +
      '<button class="qty' + (i.qty ? "" : " empty") + '" data-act="qty" data-id="' + esc(i.id) + '" aria-label="Change quantity">' + (i.qty ? esc(i.qty) : "qty") + "</button>" +
      '<button class="del" data-act="del" data-id="' + esc(i.id) + '" aria-label="Remove ' + esc(i.name) + '">×</button></li>';
  }
  function render() {
    if (document.activeElement && document.activeElement.closest && document.activeElement.closest("li") && document.activeElement.tagName === "INPUT") return;
    const s = view();
    const toBuy = s.items.filter(i => !i.checked), inCart = s.items.filter(i => i.checked);
    document.getElementById("summary").textContent = loaded ? toBuy.length + " to buy" + (inCart.length ? " · " + inCart.length + " in the cart" : "") : "Loading the list…";
    const list = document.getElementById("list");
    if (!loaded) list.innerHTML = "";
    else if (!s.items.length) list.innerHTML = '<div class="empty-state">The list is empty. Add what the house needs above, and everyone with the link sees it.</div>';
    else if (!toBuy.length) list.innerHTML = '<div class="empty-state">Everything is in the cart.</div>';
    else list.innerHTML = AISLES.map(([key, label]) => {
      const its = toBuy.filter(i => (AISLE_NAME[i.aisle] ? i.aisle : "other") === key);
      if (!its.length) return "";
      return '<section class="aisle"><div class="aisle-head"><span>' + label + '</span><span class="n">' + its.length + "</span></div>" +
        '<ul class="items">' + its.map(row).join("") + "</ul></section>";
    }).join('<div style="height:6px"></div>');
    const cart = document.getElementById("cart");
    if (inCart.length) {
      const ctrl = confirmingClear
        ? '<span class="confirm">Clear ' + inCart.length + ' bought item' + (inCart.length > 1 ? "s" : "") + '? <button class="btn btn-danger" data-act="clear-yes">Clear</button><button class="btn btn-ghost" data-act="clear-no">Keep</button></span>'
        : '<button class="btn btn-ghost" data-act="clear">Done shopping</button>';
      cart.innerHTML = '<section class="aisle"><div class="section-title"><span>In the cart <span class="n" style="font-family:var(--body);font-size:12px;color:var(--muted)">' + inCart.length + "</span></span>" + ctrl + "</div>" +
        '<ul class="items">' + inCart.map(row).join("") + "</ul></section>";
    } else cart.innerHTML = "";
    const onList = new Set(s.items.map(i => i.name.toLowerCase()));
    const hist = s.history.filter(h => !onList.has(h.name.toLowerCase())).slice(0, 14);
    document.getElementById("again").innerHTML = hist.length
      ? '<section class="aisle"><div class="section-title"><span>Buy again</span></div><div class="chips">' +
        hist.map(h => '<button data-act="again" data-name="' + esc(h.name) + '">' + esc(h.name) + "</button>").join("") + "</div></section>" : "";
    const who = document.getElementById("who");
    if (!who.querySelector("input:focus")) who.innerHTML = myName
      ? 'Adding as <strong>' + esc(myName) + '</strong> <button type="button" data-act="rename">change</button>'
      : '<label for="who-name">Your name (optional, shows on items you add):</label> <input id="who-name" maxlength="20" placeholder="e.g. Imran"> <button type="button" data-act="save-name">Save</button>';
  }

  const nameInput = document.getElementById("f-name");
  document.getElementById("add-form").addEventListener("submit", e => {
    e.preventDefault();
    const name = nameInput.value.trim().replace(/\s+/g, " ");
    if (!name) return;
    const qtyEl = document.getElementById("f-qty");
    act({ t: "add", item: { id: uid(), name: name.charAt(0).toUpperCase() + name.slice(1), qty: qtyEl.value.trim(), by: myName } });
    nameInput.value = ""; qtyEl.value = ""; nameInput.focus();
  });
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act, id = b.dataset.id, s = view();
    if (a === "toggle") { const it = s.items.find(i => i.id === id); if (it) act({ t: "toggle", itemId: id, checked: !it.checked }); }
    else if (a === "del") act({ t: "del", itemId: id });
    else if (a === "qty") {
      const it = s.items.find(i => i.id === id); if (!it) return;
      const input = document.createElement("input");
      input.value = it.qty || ""; input.maxLength = 12; input.setAttribute("aria-label", "Quantity");
      input.style.cssText = "width:70px;font:inherit;font-size:14px;padding:4px 8px;border-radius:999px;border:1px solid var(--accent);background:var(--bg);color:var(--ink);text-align:center";
      b.replaceWith(input); input.focus(); input.select();
      let done = false;
      const commit = () => { if (done) return; done = true; input.blur(); const v = input.value.trim(); if (v !== (it.qty || "")) act({ t: "qty", itemId: id, qty: v }); else render(); };
      input.addEventListener("keydown", ev => { if (ev.key === "Enter") commit(); if (ev.key === "Escape") { done = true; input.remove(); render(); } });
      input.addEventListener("blur", commit);
    }
    else if (a === "clear") { confirmingClear = true; render(); }
    else if (a === "clear-no") { confirmingClear = false; render(); }
    else if (a === "clear-yes") { confirmingClear = false; act({ t: "clear", ids: s.items.filter(i => i.checked).map(i => i.id) }); }
    else if (a === "again") act({ t: "add", item: { id: uid(), name: b.dataset.name, qty: "", by: myName } });
    else if (a === "rename") { myName = ""; document.getElementById("who").innerHTML = ""; render(); const i = document.getElementById("who-name"); if (i) i.focus(); }
    else if (a === "save-name") {
      const i = document.getElementById("who-name"); myName = (i && i.value.trim()) || "";
      try { localStorage.setItem(NAME_KEY, myName); } catch (err) {}
      if (i) i.blur(); render();
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target && e.target.id === "who-name") { e.preventDefault(); document.querySelector('[data-act="save-name"]').click(); }
  });

  render(); refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
