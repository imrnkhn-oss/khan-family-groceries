services:
  - type: web
    name: khan-family-groceries
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: khan-groceries-db
          property: connectionString
databases:
  - name: khan-groceries-db
    plan: free
    region: virginia
